:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:#f4f6fb;color:#202942}body{padding:32px 20px}main{max-width:720px}.eyebrow{font-size:10px;letter-spacing:2px;color:#8993aa}h1{font-size:30px;letter-spacing:-1px;margin:8px 0}header p{font-size:13px;margin:0;color:#8993aa}.panel{padding:22px;margin-top:24px;border-radius:24px;border:0;box-shadow:0 8px 35px #263e7510}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:#f1f3f8;padding:5px;border-radius:14px}.tabs button{padding:12px 4px;font-size:14px;background:transparent;color:#768097;border-radius:10px}.tabs button[aria-selected=true]{background:white;color:#325cda;box-shadow:0 2px 8px #273f7410;font-weight:700}.rule{font-size:12px;line-height:1.7;margin:14px 0}.draw-info{font-size:12px;color:#768097;border-bottom:1px solid #edf0f7;padding-bottom:14px}.draw-info strong{color:#4f6083}#kl8-options{margin-top:16px;font-size:13px}select{font:inherit;border:1px solid #e0e5f0;border-radius:10px;padding:8px 12px;background:white;color:#304467}.controls{display:grid;grid-template-columns:1fr 82px;gap:10px;margin-top:20px}.controls label{font-size:13px;color:#66748f;align-self:center}.controls input{width:100%;height:44px;text-align:center;background:#f7f9fc;border-color:#e6eaf3;font-size:16px}.controls .primary{grid-column:1/-1;height:50px;border-radius:13px;font-weight:600;background:#365fdf;box-shadow:0 5px 14px #365fdf25}.toolbar{margin:18px 0 10px;justify-content:flex-end}.toolbar button{background:transparent;color:#7a88a3;padding:8px;font-size:12px;min-height:40px}.status{font-size:12px;color:#8792a9;margin:8px 0 16px}#results{display:grid;gap:12px}.row{position:relative;display:block;border:1px solid #e9edf5;background:#fafbfe;padding:50px 14px 18px;border-radius:16px}.index{position:absolute;top:17px;left:16px;font-size:12px;color:#7d8ba5;width:auto}.row>button{position:absolute;right:10px;top:7px;background:white;border:1px solid #e8ecf5;border-radius:9px;color:#64779e;min-width:60px;min-height:36px}.balls{display:flex;flex-wrap:nowrap;gap:6px;justify-content:flex-start}.ball{width:36px;height:36px;flex:0 0 36px;font-size:16px;background:#ffedf0;color:#d54a61;box-shadow:inset 0 -2px 0 #d54a6109}.blue{background:#e9f0ff;color:#3a68d9}.divider{font-size:12px;margin:0;color:#a4afc4}.row.kl8 .balls{display:grid;grid-template-columns:repeat(5,36px);gap:10px 14px}.foot{font-size:11px;color:#9aa3b5;line-height:1.9;margin:20px 8px}.foot a{color:inherit}@media(max-width:520px){body{padding:24px 14px}h1{font-size:26px}.panel{padding:16px;margin-top:20px}.ball{width:32px;height:32px;flex-basis:32px;font-size:15px}.balls{gap:5px}.row{padding-left:12px;padding-right:12px}.row.kl8 .balls{grid-template-columns:repeat(5,32px);justify-content:space-between;gap:12px 6px}}@media(max-width:350px){body{padding:20px 10px}.panel{padding:12px}.ball{width:28px;height:28px;flex-basis:28px;font-size:13px}.balls{gap:4px}}.check-boxes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}.check-boxes[hidden]{display:none}.check-boxes input{width:100%;min-width:0;padding:8px 2px;text-align:center;font-size:16px}</style>

<body><main>
<header><div class="eyebrow">RANDOM PICKS / 随机选号</div><h1>随机选号</h1><p>大乐透 · 双色球 · 快乐8</p></header>
<section class="panel" aria-label="号码生成器">
<div class="tabs" role="tablist" aria-label="彩票种类"><button id="dlt" role="tab" aria-selected="true">超级大乐透</button><button id="ssq" role="tab" aria-selected="false">双色球</button><button id="kl8" role="tab" aria-selected="false">快乐8</button></div>
<div id="kl8-options" hidden><label for="kl8-count">快乐8玩法：</label><select id="kl8-count"><option value="1" >选1</option><option value="2" >选2</option><option value="3" >选3</option><option value="4" >选4</option><option value="5" >选5</option><option value="6" >选6</option><option value="7" >选7</option><option value="8" >选8</option><option value="9" >选9</option><option value="10" selected>选10</option></select></div>
<p id="rule" class="rule"></p>
<div id="draw-info" class="draw-info"></div>
<form id="form" class="controls"><label for="count">生成注数</label><input id="count" type="number" min="1" max="100" step="1" value="5" required><button class="primary" type="submit">随机生成</button></form>
<div class="toolbar"><button id="copy" type="button">复制全部号码</button><button id="download" type="button">导出 TXT</button></div>
<div id="status" class="status" role="status" aria-live="polite"></div>
<div id="results" aria-label="生成结果"></div>
<section style="margin-top:22px;border-top:1px solid #e9edf5;padding-top:16px">
<h2 style="font-size:18px">今日记录与号码核对</h2>
<p id="day-note" class="rule"></p>
<details><summary>查看今日号码</summary><pre id="day-list" style="white-space:pre-wrap"></pre></details>
<button type="button" id="toggle-import" aria-expanded="false">导入今日号码</button>
<button type="button" id="copy-day">复制今日号码</button>
<form id="import-day" hidden style="margin-top:10px">
<label for="import-text">粘贴同一彩种的号码，每注一行</label>
<textarea id="import-text" rows="5" style="width:100%;font:inherit;font-size:16px" required></textarea>
<button type="submit">保存到今日记录</button>
</form>
<p id="import-status" role="status" class="rule"></p>
<form id="check-form" style="display:grid;gap:10px;margin-top:14px">
<label for="check-type">核对类型</label><select id="check-type"><option>正式开奖号码</option><option>开机号码</option></select>
<label id="check-label" for="check-front"></label><div id="check-front" class="check-boxes" role="group" aria-labelledby="check-label"></div>
<label id="check-back-label" for="check-back"></label><div id="check-back" class="check-boxes" role="group" aria-labelledby="check-back-label"></div>
<div style="display:flex;flex-wrap:wrap;gap:8px"><button type="submit">核对今日号码</button><button id="clear-check" type="button">一键清除</button></div>
</form><pre id="check-result" role="status" style="white-space:pre-wrap"></pre></section></section>
<p class="foot">每注各区号码不重复，并按升序排列；同批次整注不重复。随机选号不预测开奖结果，也不会提高中奖概率。<br>规则参考：<a href="https://www.sport.gov.cn/n14471/n14475/n14512/c693663/content.html" target="_blank" rel="noopener">大乐透</a> / <a href="https://www.scflcp.com.cn/ssq" target="_blank" rel="noopener">双色球</a>。</p>
</main>
<script>
'use strict';
const games={dlt:{name:'超级大乐透',front:35,frontCount:5,back:12,backCount:2,rule:'前区 01–35 选 5 个，后区 01–12 选 2 个。'},ssq:{name:'双色球',front:33,frontCount:6,back:16,backCount:1,rule:'红球 01–33 选 6 个，蓝球 01–16 选 1 个。'}};
games.kl8={name:'快乐8',front:80,frontCount:10,back:0,backCount:0,rule:'从 01–80 中随机选择 1–10 个号码，每注不重复。'};
let current='dlt',tickets=[];
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0');
// 拒绝采样避免取模偏差；部分 Fisher–Yates 洗牌保证区内无重复。
function randomInt(max){const limit=4294967296-(4294967296%max),buffer=new Uint32Array(1);do{crypto.getRandomValues(buffer)}while(buffer[0]>=limit);return buffer[0]%max;}
function pick(total,count){const pool=Array.from({length:total},(_,i)=>i+1);for(let i=0;i<count;i++){const j=i+randomInt(total-i);[pool[i],pool[j]]=[pool[j],pool[i]];}return pool.slice(0,count).sort((a,b)=>a-b);}
function generateTickets(key,count){const g=games[key],seen=new Set(),result=[];if(key==='kl8'&&g.frontCount===1&&count>80)throw new RangeError('选1最多生成80注不同号码');while(result.length<count){const front=pick(g.front,g.frontCount),back=pick(g.back,g.backCount),signature=front.join(',')+'|'+back.join(',');if(!seen.has(signature)){seen.add(signature);result.push({front,back});}}return result;}
function render(){const fragment=document.createDocumentFragment();tickets.forEach((ticket,i)=>{const row=document.createElement('div');row.className='row'+(current==='kl8'?' kl8':'');const index=document.createElement('span');index.className='index';index.textContent='第 '+(i+1)+' 注';row.append(index);const balls=document.createElement('div');balls.className='balls';['front','back'].forEach((area,idx)=>{if(idx && ticket.back.length){const divider=document.createElement('span');divider.className='divider';divider.textContent='+';balls.append(divider);}ticket[area].forEach(number=>{const ball=document.createElement('span');ball.className='ball'+(idx?' blue':'');ball.textContent=pad(number);balls.append(ball);});});row.append(balls);const copyButton=document.createElement('button');copyButton.type='button';copyButton.textContent='复制';copyButton.style.cssText='margin-left:auto;padding:8px 12px;font-size:13px';copyButton.setAttribute('aria-label','复制第'+(i+1)+'注号码');copyButton.addEventListener('click',async()=>{const text=games[current].name+' 自选号码\r\n'+'第'+(i+1)+'注. '+ticket.front.map(pad).join(' ')+(ticket.back.length?' + '+ticket.back.map(pad).join(' '):'');let copied=false;try{await navigator.clipboard.writeText(text);copied=true;}catch(error){const field=document.createElement('textarea');field.value=text;document.body.append(field);field.select();try{copied=document.execCommand('copy');}catch(e){}field.remove();}copyButton.textContent=copied?'已复制':'复制失败';$('status').textContent=copied?'第'+(i+1)+'注号码已复制。':'浏览器限制了复制，请使用导出 TXT。';setTimeout(()=>{copyButton.textContent='复制';},1500);});row.append(copyButton);fragment.append(row);});$('results').replaceChildren(fragment);}
function generate(){const count=Number($('count').value);if(!Number.isInteger(count)||count<1||count>100){$('status').textContent='请输入 1–100 之间的整数。';return;}if(current==='kl8'&&games.kl8.frontCount===1&&count>80){$('status').textContent='选1最多生成80注不同号码。';return;}try{tickets=generateTickets(current,count);render();$('status').textContent=`已生成 ${count} 注${games[current].name}号码。`;}catch(error){$('status').textContent='当前浏览器不支持安全随机数，请使用新版 Edge、Chrome 或 Firefox。';}}
function exportText(){return games[current].name+' 自选号码\r\n'+tickets.map((t,i)=>`第${i+1}注. ${t.front.map(pad).join(' ')}${t.back.length?' + '+t.back.map(pad).join(' '):''}`).join('\r\n');}
for(const key of Object.keys(games)){$(key).addEventListener('click',()=>{current=key;$('kl8-options').hidden=key!=='kl8';for(const k of Object.keys(games))$(k).setAttribute('aria-selected',String(k===key));$('rule').textContent=games[key].rule;updateDraw();tickets=[];render();$('status').textContent='点击随机生成获取号码。';});}
$('kl8-count').addEventListener('change',()=>{games.kl8.frontCount=Number($('kl8-count').value);tickets=[];render();$('status').textContent='点击随机生成获取号码。';});
$('form').addEventListener('submit',event=>{event.preventDefault();generate();});
$('copy').addEventListener('click',async()=>{if(!tickets.length)return;const text=exportText();try{await navigator.clipboard.writeText(text);$('status').textContent='全部号码已复制。';}catch(error){const field=document.createElement('textarea');field.value=text;field.style.position='fixed';field.style.top='0';document.body.append(field);field.select();let copied=false;try{copied=document.execCommand('copy');}catch(e){}field.remove();$('status').textContent=copied?'全部号码已复制。':'浏览器限制了剪贴板访问，请使用“导出 TXT”。';}});
$('download').addEventListener('click',()=>{if(!tickets.length)return;const url=URL.createObjectURL(new Blob(['\ufeff'+exportText()],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=games[current].name+'随机号码.txt';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);$('status').textContent='已导出号码文件。';});
function updateDraw(){$('draw-info').textContent={dlt:'每周一、三、六开奖',ssq:'每周二、四、日开奖',kl8:'每天开奖'}[current]+' · 休市及调整以官方公告为准';}updateDraw();$('rule').textContent=games[current].rule;$('status').textContent='点击随机生成获取号码。';
const storageKey='lottery-picker-daily-v1';
const dayFormatter=new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'});
let day=dayFormatter.format(new Date());
let records={};
let storageAvailable=true;
function readDay(){
  const today=dayFormatter.format(new Date());
  if(today!==day){day=today;records={};$('check-form').reset();$('check-result').textContent='';}
  try{
    const saved=JSON.parse(localStorage.getItem(storageKey)||'null');
    if(saved?.day===day)records=saved.records;
    else if(saved)localStorage.removeItem(storageKey);
  }catch{storageAvailable=false;}
}
function setupBoxes(area,count){
 const group=$('check-'+area);
 if(group.children.length===count)return;
 group.replaceChildren(...Array.from({length:count},(_,i)=>{
   const field=document.createElement('input');
   field.type='text';field.inputMode='numeric';field.maxLength=2;
   field.setAttribute('aria-label',(area==='front'?'主区':'附加区')+'第'+(i+1)+'个号码');
   field.addEventListener('input',()=>{field.value=field.value.replace(/[^0-9]/g,'');if(field.value.length===2)field.nextElementSibling?.focus();});
   return field;
 }));
}
function boxValues(area){return Array.from($('check-'+area).children,field=>field.value).join(' ');}
$('check-form').addEventListener('paste',event=>{
 if(!event.target.closest('.check-boxes'))return;
 const raw=event.clipboardData.getData('text').trim();
 if(!/^[0-9\s,，、+＋]+$/.test(raw))return;
 const numbers=raw.match(/[0-9]+/g)||[];
 const fields=Array.from($('check-form').querySelectorAll('.check-boxes:not([hidden]) input'));
 const start=fields.indexOf(event.target);
 if(start<0)return;
 event.preventDefault();
 if(numbers.some(n=>n.length>2)||numbers.length>fields.length-start){
   $('check-result').textContent='粘贴的号码超出可填写范围，请从第一个框开始。';return;
 }
 numbers.forEach((n,i)=>{fields[start+i].value=n.padStart(2,'0');});
 fields[Math.min(start+numbers.length,fields.length-1)].focus();
});
function refreshDay(){
  readDay();
  const rows=records[current]||[];
  $('day-note').textContent=day+'（北京时间） · 今日 '+rows.length+' 注'+(storageAvailable?' · 次日清空':' · 浏览器无法持久保存');
  $('day-list').textContent=rows.map((t,i)=>'第'+(i+1)+'注. '+t.front.map(pad).join(' ')+(t.back.length?' + '+t.back.map(pad).join(' '):'')).join('\n')||'暂无记录';
  $('check-label').textContent={dlt:'前区（5个）',ssq:'红球（6个）',kl8:'开奖号码（20个）'}[current];
  $('check-back-label').textContent=current==='dlt'?'后区（2个）':'蓝球（1个）';
  setupBoxes('front',current==='kl8'?20:games[current].frontCount);
  setupBoxes('back',games[current].backCount);
  $('check-back').hidden=$('check-back-label').hidden=current==='kl8';
}
const originalGenerate=generate;
generate=function(){
  readDay();
  const previous=tickets;
  originalGenerate();
  if(previous===tickets||!tickets.length)return;
  records[current]=(records[current]||[]).concat(tickets);
  try{localStorage.setItem(storageKey,JSON.stringify({day,records}));}catch{storageAvailable=false;}
  $('check-result').textContent='';
  refreshDay();
};
function parseDraw(value,count,max){
  const parts=value.trim().split(/[\s,，、]+/);
  const values=parts.map(Number);
  if(parts.length!==count||parts.some((p,i)=>!/^\d{1,2}$/.test(p)||values[i]<1||values[i]>max)||new Set(values).size!==count)return null;
  return new Set(values);
}
$('check-form').addEventListener('submit',event=>{
  event.preventDefault();
  readDay();
  const rows=records[current]||[],g=games[current],kl8=current==='kl8';
  const front=parseDraw(boxValues('front'),kl8?20:g.frontCount,g.front);
  const back=kl8?new Set():parseDraw(boxValues('back'),g.backCount,g.back);
  const result=$('check-result');
  if(!rows.length){result.textContent='今天还没有生成这个彩种的号码。';return;}
  if(!front||!back){result.textContent='请按提示输入正确数量、范围内且不重复的号码。';return;}
  const isDraw=$('check-type').selectedIndex===0;
  result.textContent=(isDraw?'正式开奖号匹配 · 请以官方奖级和彩票期号为准':'开机号匹配 · 仅供参考，不能判断中奖')+'\n'+rows.map((t,i)=>{
    const a=t.front.filter(n=>front.has(n)),b=t.back.filter(n=>back.has(n));
    return '第'+(i+1)+'注：'+(kl8?'选'+t.front.length+'，中 '+a.length+' 个':'命中 '+a.length+' + '+b.length)+'（'+[...a,...b].map(pad).join(' ')+'）';
  }).join('\n');
});
for(const key of Object.keys(games))$(key).addEventListener('click',()=>{$('check-form').reset();$('check-result').textContent='';refreshDay();});
refreshDay();
setInterval(()=>{if(dayFormatter.format(new Date())!==day){tickets=[];render();$('status').textContent='点击随机生成获取号码。';refreshDay();}},15000);

$('clear-check').addEventListener('click',()=>{
  for(const field of $('check-form').querySelectorAll('.check-boxes input'))field.value='';
  $('check-result').textContent='';
  $('check-front').querySelector('input')?.focus();
});

$('toggle-import').addEventListener('click',()=>{
  const form=$('import-day');
  form.hidden=!form.hidden;
  $('toggle-import').setAttribute('aria-expanded',String(!form.hidden));
  if(!form.hidden)$('import-text').focus();
});
$('copy-day').addEventListener('click',async()=>{
  refreshDay();
  if(!(records[current]||[]).length){$('import-status').textContent='这个彩种今天还没有记录。';return;}
  const value=games[current].name+' 自选号码\n'+$('day-list').textContent;
  try{await navigator.clipboard.writeText(value);$('import-status').textContent='已复制这个彩种的全部今日号码。';}
  catch{
    if($('import-day').hidden)$('toggle-import').click();
    $('import-text').value=value;
    $('import-text').select();
    $('import-status').textContent='请手动复制文本框内已选中的号码。';
  }
});
$('import-day').addEventListener('submit',event=>{
  event.preventDefault();
  refreshDay();
  const status=$('import-status'),game=games[current];
  const lines=$('import-text').value.trim().split(/\r?\n/).map(line=>line.trim()).filter(Boolean);
  const header=lines[0]?.match(/^(超级大乐透|大乐透|双色球|快乐8)\s*(?:自选|随机)号码$/);
  if(header){
    if(header[1]!==game.name&&!(current==='dlt'&&header[1]==='大乐透')){
      status.textContent='请先切换到粘贴内容对应的彩种。';return;
    }
    lines.shift();
  }
  if(!lines.length){status.textContent='请粘贴至少一注号码。';return;}
  const imported=[];
  for(const [index,line] of lines.entries()){
    const groups=line.replace(/^(?:第\s*\d+\s*注|\d+)[.．、:：]\s*/,'').split(/[+＋]/);
    const count=current==='kl8'?groups[0].trim().split(/[\s,，、]+/).length:game.frontCount;
    const front=count<=10?parseDraw(groups[0],count,game.front):null;
    const back=game.backCount&&groups.length===2?parseDraw(groups[1],game.backCount,game.back):new Set();
    if(!front||!back||groups.length!==(game.backCount?2:1)){
      status.textContent='第'+(index+1)+'行号码格式或数量有误，整批尚未导入。';return;
    }
    imported.push({front:[...front].sort((a,b)=>a-b),back:[...back].sort((a,b)=>a-b)});
  }
  const rows=records[current]||[];
  const seen=new Set(rows.map(row=>row.front.join(',')+'|'+row.back.join(',')));
  const added=imported.filter(row=>{
    const key=row.front.join(',')+'|'+row.back.join(',');
    if(seen.has(key))return false;
    seen.add(key);return true;
  });
  records[current]=rows.concat(added);
  try{localStorage.setItem(storageKey,JSON.stringify({day,records}));}catch{storageAvailable=false;}
  $('check-result').textContent='';
  refreshDay();
  $('import-text').value='';
  status.textContent='已导入 '+added.length+' 注，跳过 '+(imported.length-added.length)+' 注重复号码。'+(storageAvailable?'':' 浏览器无法持久保存。');
});
</script></body></html>
